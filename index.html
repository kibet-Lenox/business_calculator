<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BUSINESS CALCULATOR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box}
    body{
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background:#f5f7fb;
      color:#1e293b;
      margin:0;
      padding:20px;
    }
    .container{max-width:440px;margin:0 auto;}
    h1{
      color:#0f4c75;
      font-size:28px;
      margin:10px 0 4px;
      font-weight:800;
      letter-spacing:-0.5px;
    }
    .subtitle{
      color:#64748b;
      font-size:14px;
      margin:0 0 20px;
    }
    .card{
      background:white;
      border-radius:16px;
      padding:20px;
      box-shadow:0 4px 20px rgba(15,76,117,0.08);
      border:1px solid #eef2f7;
    }
    .label{
      font-size:11px;
      font-weight:700;
      color:#475569;
      margin:14px 0 6px;
      text-transform:uppercase;
      letter-spacing:0.6px;
      display:block;
    }
    .label:first-child{margin-top:0}
    input{
      width:100%;
      padding:13px 14px;
      border:1px solid #e2e8f0;
      border-radius:10px;
      font-size:15px;
      outline:none;
      background:#f8fafc;
      transition:0.2s;
    }
    input:focus{
      background:white;
      border-color:#2E75B6;
      box-shadow:0 0 0 3px rgba(46,117,182,0.15);
    }
    .divider{height:1px;background:#f1f5f9;margin:18px 0;}
    button{
      width:100%;
      margin-top:8px;
      padding:14px;
      background:#1F4E79;
      color:white;
      border:none;
      border-radius:10px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }
    button:hover{background:#163a5c}
    button:active{transform:scale(0.98)}
    #result{
      background:white;
      border-radius:16px;
      padding:20px;
      margin-top:16px;
      box-shadow:0 4px 20px rgba(15,76,117,0.08);
      border:1px solid #eef2f7;
      line-height:1.6;
      min-height:60px;
    }
    #result h3{margin:0 0 6px;color:#0f4c75}
    #result h4{margin:18px 0 10px;color:#334155}
    #result a{color:#2E75B6;text-decoration:none;font-weight:600}
    #result hr{border:none;border-top:1px solid #f1f5f9;margin:14px 0}
  </style>
</head>
<body>
<div class="container">
  <h1>Currency converter</h1>
  <p class="subtitle">Business news generator.</p>

  <div class="card">
    <span class="label">Your Country Code</span>
    <input type="text" id="CountryInput" placeholder="e.g. KES, UGX, TZS">

    <span class="label">Amount to Convert</span>
    <input type="number" id="CurrencyValue" placeholder="e.g. 2500">

    <span class="label">Convert To</span>
    <input type="text" id="CurrencyOutput" placeholder="e.g. USD" value="USD">

    <div class="divider"></div>

    <span class="label">ExchangeRate API Key</span>
    <input type="password" id="ExchangeRateAPI-key" placeholder="Enter ExchangeRate API key">

    <span class="label">NewsAPI Key</span>
    <input type="password" id="NEWsAPI-key" placeholder="Enter NewsAPI key">

    <button onclick="LoadConverter()">Search</button>
  </div>

  <div id="result">Enter the above details and click Search.</div>
</div>
  <div class="contact-card">
    <h3>Contact Support</h3>
    <div class="tag"><span>📧</span> kibetlenox07@gmail.com </div>
    <div class="tag"><span>📞</span> +254 768802621</div>
    <div class="tag"><span>📍</span> Bomet, Kenya</div>
  </div>
<script>
  async function LoadConverter() {
  const country = document.getElementById('CountryInput').value.trim();
  const amount = document.getElementById('CurrencyValue').value.trim();
  const exKey = document.getElementById('ExchangeRateAPI-key').value.trim();
  const newsKey = document.getElementById('NEWsAPI-key').value.trim();
  const target = document.getElementById('CurrencyOutput').value.trim().toUpperCase();

  if (! country || !amount || !exKey || !newsKey) {
    alert("Please fill all the fields");
    return; 
  }
  
  document.getElementById("result").innerHTML = "Please wait... (Loading in Process.)";
  
try {
  const url =`https://v6.exchangerate-api.com/v6/${exKey}/latest/${country.toUpperCase()}`;
  const res = await fetch(url);
  const data = await res.json();

  if (data.result === "error") {
    document.getElementById("result").innerHTML = `API Error: ${data['error-type']}<br>Check your key or country code.`;
    return;
  }

  const rate = data.conversion_rates[target];

  // convert KES 
  let countryName = country;
  if (country.toUpperCase() === "KES") countryName = "Kenya";
  if (country.toUpperCase() === "UGX") countryName = "Uganda";
  if (country.toUpperCase() === "TZS") countryName = "Tanzania";

  const newsUrl = `https://newsapi.org/v2/everything?q=${countryName}+business&language=en&sortBy=publishedAt&apiKey=${newsKey}`;
  const newsRes = await fetch(newsUrl);
  const newsData = await newsRes.json();
  
  if (!data.conversion_rates || !rate) {
    document.getElementById("result").innerHTML = `Rate not found for ${country.toUpperCase()} -> ${target}. Check codes.`;
    return;
  }

  const converted = (parseFloat(amount) * rate).toFixed(2);

  let newsHtml = "";
  if (newsData.articles && newsData.articles.length > 0) {
    const top3 = newsData.articles.slice(0, 3);
    newsHtml = top3.map(a => 
      `<p><strong>${a.title}</strong><br>${a.description || ""}<br><a href="${a.url}" target="_blank">Read more</a></p>`
    ).join("");
  } else {
    newsHtml = "<p>No news found.</p>";
  }

  document.getElementById("result").innerHTML = `
    <h3>${amount} ${country.toUpperCase()} = ${converted} ${target}</h3>
    <p>Rate: 1 ${country.toUpperCase()} = ${rate} ${target}</p>
    <hr>
    <h4>Business News: ${countryName}</h4>
    ${newsHtml}
  `;

} catch (error) {
  document.getElementById("result").innerHTML = "Error: " + error.message;
}
} 
</script>
</body>
</html>
